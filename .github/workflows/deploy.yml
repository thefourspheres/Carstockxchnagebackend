name: deploy
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SVC: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (current code)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --no-git --source /repo -v
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pip-audit
      - name: Import check
        run: python -c "import app.main"
        env: { DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x", JWT_SECRET: ci }
      - name: Dependency vuln scan
        run: pip-audit -r requirements.txt

  build-deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Image name + tag
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$SVC" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMG }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vuln scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMG:$TAG"
      - name: Push image (immutable sha tag + latest)
        run: |
          docker tag "$IMG:$TAG" "$IMG:latest"
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
      # shortcut: Coolify app tracks :latest; rollback = set image tag to an older sha-... in Coolify UI
      - name: Deploy via Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          curl -fsS --max-time 60 -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&force=false"
