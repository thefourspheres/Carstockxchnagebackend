name: deploy
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SVC: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: ci, POSTGRES_DB: cartest }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (current code)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --no-git --source /repo -v
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pip-audit pytest pytest-asyncio httpx
      - name: Import check
        run: python -c "import app.main"
        env: { DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x", JWT_SECRET: ci }
      - name: Tests
        run: python -m pytest -q
        env: { DATABASE_URL: "postgresql+asyncpg://app:ci@localhost:5432/cartest", JWT_SECRET: "ci-only-secret-0123456789abcdef0123456789abcdef" }
      - name: Dependency vuln scan
        run: pip-audit -r requirements.txt

  build-deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Image name + tag
        run: |
          echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$SVC" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMG }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vuln scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMG:$TAG"
      - name: Push image (immutable sha tag + latest)
        run: |
          docker tag "$IMG:$TAG" "$IMG:latest"
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
      - name: Deploy to VPS
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes deploy@"$HOST" "$SVC $TAG"
